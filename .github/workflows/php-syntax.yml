name: PHP Syntax Check

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: none

      - name: Show PHP version
        run: php -v

      - name: Check PHP syntax
        shell: bash
        run: |
          set -e

          FAILED=0
          COUNT=0

          while IFS= read -r -d '' file; do
            COUNT=$((COUNT + 1))

            if ! php -l "$file"; then
              echo "::error file=$file::PHP syntax error detected"
              FAILED=1
            fi
          done < <(
            find . \
              -type f \
              -name "*.php" \
              ! -path "./vendor/*" \
              ! -path "./node_modules/*" \
              ! -path "./.git/*" \
              -print0
          )

          echo ""
          echo "PHP files checked: $COUNT"

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more PHP syntax errors were detected."
            exit 1
          fi

          echo "All PHP files passed syntax validation on PHP 8.3."
